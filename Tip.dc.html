<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/corav2-9d4988f6-df57-40ac-b271-8f4451a55acf/styles.css">
</helmet>
<span style="position:relative;display:inline-flex;flex-shrink:0">
  <button onMouseEnter="{{ open }}" onMouseLeave="{{ close }}" onClick="{{ toggle }}" aria-label="Más información" style="display:inline-flex;background:none;border:0;padding:0;margin:0;cursor:pointer;color:rgba(123,104,238,0.7);transition:color .15s" style-hover="color:#7B68EE">
    <dc-import name="Icon" i="help" s="14" hint-size="14px,14px"></dc-import>
  </button>
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <span style="{{ bubbleStyle }}">{{ text }}<span style="{{ arrowStyle }}"></span></span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:60},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Más información sobre esta sección.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dir&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;up&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  /* dir="down" (30 ago 2026, a pedido explícito): por defecto la burbuja se
     abre hacia arriba — pero si el ícono está pegado al borde superior de la
     pantalla (ej. la barra de arriba, siempre visible en toda la app), se
     corta contra el techo de la ventana. Con dir="down" se abre hacia abajo
     en vez de hacia arriba — mismo componente, solo cambia de qué lado sale
     la burbuja y la flechita. */
  renderVals() {
    const down = this.props.dir === "down";
    return {
      text: this.props.text ?? "",
      isOpen: this.state.open,
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false }),
      toggle: () => this.setState(s => ({ open: !s.open })),
      bubbleStyle: {
        position:"absolute", zIndex:50, left:"50%", transform:"translateX(-50%)",
        [down ? "top" : "bottom"]:"100%", [down ? "marginTop" : "marginBottom"]:"8px",
        width:"256px", background:"#7B68EE", color:"#fff", fontSize:"12px", lineHeight:1.625,
        borderRadius:"12px", padding:"12px", boxShadow:"0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)",
        pointerEvents:"none", fontWeight:400, textAlign:"left"
      },
      arrowStyle: {
        position:"absolute", left:"50%", transform:"translateX(-50%)",
        [down ? "bottom" : "top"]:"100%", borderWidth:"5px", borderStyle:"solid", borderColor:"transparent",
        [down ? "borderBottomColor" : "borderTopColor"]:"#7B68EE"
      }
    };
  }
}
</script>
</body>
</html>
