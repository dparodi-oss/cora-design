<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/corav2-9d4988f6-df57-40ac-b271-8f4451a55acf/styles.css">
</helmet>
<span style="position:relative;display:inline-flex;flex-shrink:0">
  <button onMouseEnter="{{ open }}" onMouseLeave="{{ close }}" onClick="{{ toggle }}" aria-label="Más información" style="display:inline-flex;background:none;border:0;padding:0;margin:0;cursor:pointer;color:rgba(123,104,238,0.7);transition:color .15s" style-hover="color:#7B68EE">
    <dc-import name="Icon" i="help" s="14" hint-size="14px,14px"></dc-import>
  </button>
  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <span style="position:absolute;z-index:50;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:8px;width:256px;background:#7B68EE;color:#fff;font-size:12px;line-height:1.625;border-radius:12px;padding:12px;box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);pointer-events:none;font-weight:400;text-align:left">{{ text }}<span style="position:absolute;top:100%;left:50%;transform:translateX(-50%);border-width:5px;border-style:solid;border-color:transparent;border-top-color:#7B68EE"></span></span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:60},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Más información sobre esta sección.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    return {
      text: this.props.text ?? "",
      isOpen: this.state.open,
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false }),
      toggle: () => this.setState(s => ({ open: !s.open }))
    };
  }
}
</script>
</body>
</html>
